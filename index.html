    <script>
      (function() {
        var isWsErr = function(err) {
          var str = (err && (err.message || err.reason || (typeof err === 'string' ? err : ''))) || '';
          return typeof str === 'string' && (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsErr(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isWsErr(event.message) || isWsErr(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
