<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dotsRose" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#f0d5da" opacity="0.6"/>
    </pattern>
    <filter id="shadowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7a5c5c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="820" height="500" rx="18" fill="#fffaf7"/>
  <rect width="820" height="500" rx="18" fill="url(#dotsRose)"/>
  <rect x="6" y="6" width="808" height="488" rx="14" fill="none" stroke="#e8b4bc" stroke-width="6"/>

  <!-- lace border pattern, top edge -->
  <g fill="none" stroke="#e8b4bc" stroke-width="1.5">
    <path d="M0,14 Q10,4 20,14 T40,14 T60,14 T80,14 T100,14 T120,14 T140,14 T160,14"/>
  </g>

  <!-- ribbon bow, top-left -->
  <g transform="translate(55,30)">
    <path d="M0,0 L-24,-14 L-26,8 Z" fill="#e8b4bc" stroke="#c98a95"/>
    <path d="M0,0 L24,-14 L26,8 Z" fill="#e8b4bc" stroke="#c98a95"/>
    <circle cx="0" cy="0" r="5" fill="#7a5c5c"/>
  </g>

  <!-- pearls, scattered near title -->
  <g fill="#fdf4f0" stroke="#e8b4bc" stroke-width="1">
    <circle cx="700" cy="45" r="5"/><circle cx="716" cy="50" r="5"/><circle cx="732" cy="47" r="5"/>
  </g>

  <!-- card backings -->
  <rect x="50" y="30" width="440" height="80" rx="10" fill="#ffffff" opacity="0.85" filter="url(#shadowRose)"/>
  <rect x="50" y="130" width="400" height="140" rx="10" fill="#ffffff" opacity="0.85" filter="url(#shadowRose)"/>
  <rect x="50" y="290" width="400" height="180" rx="10" fill="#ffffff" opacity="0.9" filter="url(#shadowRose)"/>
  <rect x="470" y="290" width="320" height="120" rx="10" fill="#fdf0f0" stroke="#e8b4bc" stroke-width="2"
        stroke-dasharray="4 3" filter="url(#shadowRose)"/>

  <!-- baby's breath sprig, bottom-right -->
  <g transform="translate(770,455)" stroke="#c98a95" stroke-width="1.4" fill="none">
    <path d="M0,0 C 3,-16 -4,-30 4,-42"/>
    <circle cx="4" cy="-42" r="2.6" fill="#f3d9df" stroke="none"/>
    <circle cx="-2" cy="-28" r="2.6" fill="#f3d9df" stroke="none"/>
    <circle cx="2" cy="-14" r="2.6" fill="#f3d9df" stroke="none"/>
  </g>

  <!-- small heart charm, left margin -->
  <g transform="translate(24,120)">
    <path d="M0,8 C-14,-4 -14,-16 0,-8 C14,-16 14,-4 0,8 Z" fill="#e8b4bc" stroke="#c98a95" stroke-width="1.2"/>
  </g>

  <path d="M 0,494 L 60,494 L 55,486 L 90,490 L 130,482 L 180,492 L 240,486 L 300,494 L 820,494 L 820,500 L 0,500 Z"
        fill="#f8e4e6" opacity="0.7"/>

  <!--
    VIBE: dusty-rose-diary   ORIENTATION: horizontal
    SLOTS:
    title            x=60  y=40  w=420 h=60
    feeling_block    x=60  y=140 w=380 h=120
    gratitude_list   x=60  y=300 w=380 h=160
    quote            x=480 y=300 w=300 h=100
  -->
</svg>