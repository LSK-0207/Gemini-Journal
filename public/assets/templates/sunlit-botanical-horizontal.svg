<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dotsH" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#e9dfc4" opacity="0.6"/>
    </pattern>
    <filter id="shadowH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5a4632" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="820" height="500" rx="18" fill="#fdf6e3"/>
  <rect width="820" height="500" rx="18" fill="url(#dotsH)"/>
  <rect x="6" y="6" width="808" height="488" rx="14" fill="none" stroke="#f4c95d" stroke-width="6"/>

  <!-- torn paper corner, top-left -->
  <path d="M 20,10 L 120,10 L 116,26 L 132,20 L 140,34 L 128,44 L 20,44 Z"
        fill="#fbeecb" stroke="#e0c98a" stroke-width="1" filter="url(#shadowH)"/>

  <!-- washi tape -->
  <g transform="rotate(-4 560 30)"><rect x="500" y="14" width="120" height="30" fill="#f0a94e" opacity="0.55"/></g>
  <g transform="rotate(3 90 470)"><rect x="40" y="458" width="100" height="26" fill="#e8763c" opacity="0.4"/></g>

  <!-- quote card -->
  <rect x="470" y="290" width="320" height="120" rx="10" fill="#fffaf0" stroke="#f0d98a" stroke-width="2"
        stroke-dasharray="4 3" filter="url(#shadowH)"/>

  <!-- gratitude card -->
  <rect x="50" y="290" width="400" height="180" rx="10" fill="#ffffff" opacity="0.85" filter="url(#shadowH)"/>

  <!-- title / feeling card backing -->
  <rect x="50" y="30" width="440" height="80" rx="10" fill="#fffaf0" opacity="0.85" filter="url(#shadowH)"/>
  <rect x="50" y="130" width="400" height="140" rx="10" fill="#fffaf0" opacity="0.85" filter="url(#shadowH)"/>

  <!-- compass mark, top-right -->
  <g transform="translate(760,42)">
    <path d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z" fill="#f0a94e"/>
    <circle cx="0" cy="0" r="4" fill="#5a4632"/>
  </g>

  <!-- botanical sprig, bottom-right -->
  <g transform="translate(770,455)">
    <path d="M0,0 C -6,-14 -4,-30 6,-40" stroke="#8a9a5b" stroke-width="2.5" fill="none"/>
    <ellipse cx="4" cy="-32" rx="9" ry="5" fill="#a8bb7d" transform="rotate(-30 4 -32)"/>
    <ellipse cx="10" cy="-42" rx="8" ry="4.5" fill="#8a9a5b" transform="rotate(10 10 -42)"/>
  </g>

  <!-- pressed daisy, left margin -->
  <g transform="translate(24,120)">
    <g fill="#fdf6e3" stroke="#e0c98a">
      <ellipse cx="0" cy="-10" rx="4" ry="9" transform="rotate(0)"/>
      <ellipse cx="0" cy="-10" rx="4" ry="9" transform="rotate(45)"/>
      <ellipse cx="0" cy="-10" rx="4" ry="9" transform="rotate(90)"/>
      <ellipse cx="0" cy="-10" rx="4" ry="9" transform="rotate(135)"/>
      <ellipse cx="0" cy="-10" rx="4" ry="9" transform="rotate(180)"/>
      <ellipse cx="0" cy="-10" rx="4" ry="9" transform="rotate(225)"/>
      <ellipse cx="0" cy="-10" rx="4" ry="9" transform="rotate(270)"/>
      <ellipse cx="0" cy="-10" rx="4" ry="9" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="#f0a94e"/>
  </g>

  <path d="M 0,494 L 60,494 L 55,486 L 90,490 L 130,482 L 180,492 L 240,486 L 300,494 L 820,494 L 820,500 L 0,500 Z"
        fill="#f7ecc9" opacity="0.7"/>

  <!--
    ORIENTATION: horizontal
    SLOTS:
    title            x=60  y=40  w=420 h=60
    feeling_block    x=60  y=140 w=380 h=120
    gratitude_list   x=60  y=300 w=380 h=160
    quote            x=480 y=300 w=300 h=100
  -->
</svg>