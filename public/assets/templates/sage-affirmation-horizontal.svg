<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotsSageH" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#d8e0cc" opacity="0.6"/>
    </pattern>
    <filter id="shadowSageH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4a5a3a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- base paper -->
  <rect width="820" height="500" rx="18" fill="#eef2e6"/>
  <rect width="820" height="500" rx="18" fill="url(#dotsSageH)"/>
  <rect x="6" y="6" width="808" height="488" rx="14" fill="none" stroke="#b7c9a8" stroke-width="6"/>

  <!-- gingham tape, top-left -->
  <g transform="rotate(-3 120 28)">
    <rect x="50" y="14" width="110" height="26" fill="#f5f0e6"/>
    <g stroke="#b7c9a8" stroke-width="1">
      <line x1="50" y1="24" x2="160" y2="24"/>
      <line x1="65" y1="14" x2="65" y2="40"/>
      <line x1="80" y1="14" x2="80" y2="40"/>
      <line x1="95" y1="14" x2="95" y2="40"/>
      <line x1="110" y1="14" x2="110" y2="40"/>
      <line x1="125" y1="14" x2="125" y2="40"/>
      <line x1="140" y1="14" x2="140" y2="40"/>
    </g>
  </g>

  <!-- washi tape, top-right anchoring -->
  <g transform="rotate(2 580 26)">
    <rect x="520" y="14" width="110" height="24" fill="#d0dfc2" opacity="0.65"/>
  </g>

  <!-- cloud sticker, top-right -->
  <g transform="translate(740,48)" fill="#ffffff" stroke="#b7c9a8" stroke-width="1.5" filter="url(#shadowSageH)">
    <ellipse cx="-12" cy="4" rx="14" ry="10"/>
    <ellipse cx="6" cy="-2" rx="18" ry="13"/>
    <ellipse cx="24" cy="4" rx="12" ry="8"/>
  </g>

  <!-- card backings, parchment & clean white -->
  <rect x="50" y="30" width="440" height="80" rx="10" fill="#ffffff" opacity="0.88" filter="url(#shadowSageH)"/>
  <rect x="50" y="130" width="400" height="140" rx="10" fill="#ffffff" opacity="0.88" filter="url(#shadowSageH)"/>
  <rect x="50" y="290" width="400" height="180" rx="10" fill="#ffffff" opacity="0.88" filter="url(#shadowSageH)"/>
  <rect x="470" y="290" width="320" height="120" rx="10" fill="#f5f0e6" stroke="#b7c9a8" stroke-width="2"
        stroke-dasharray="4 3" filter="url(#shadowSageH)"/>

  <!-- checkbox sticker, right side of feeling card -->
  <g transform="translate(480,160)">
    <rect x="0" y="0" width="22" height="22" rx="4" fill="#ffffff" stroke="#b7c9a8" stroke-width="1.8"/>
    <path d="M5,11 L9,15 L17,6" stroke="#6b7d5a" stroke-width="2.2" fill="none"/>
  </g>

  <!-- botanical sprig, bottom-right -->
  <g transform="translate(765,455)">
    <path d="M0,0 C -6,-14 -4,-30 6,-40" stroke="#6b7d5a" stroke-width="2.5" fill="none"/>
    <ellipse cx="4" cy="-32" rx="9" ry="5" fill="#a8bb7d" transform="rotate(-30 4 -32)"/>
    <ellipse cx="10" cy="-42" rx="8" ry="4.5" fill="#6b7d5a" transform="rotate(10 10 -42)"/>
  </g>

  <!-- little frog mascot, left margin -->
  <g transform="translate(26,200)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#a8bb7d" stroke="#6b7d5a" stroke-width="1.5"/>
    <circle cx="-7" cy="-9" r="5" fill="#a8bb7d" stroke="#6b7d5a" stroke-width="1.5"/>
    <circle cx="6" cy="-9" r="5" fill="#a8bb7d" stroke="#6b7d5a" stroke-width="1.5"/>
    <circle cx="-7" cy="-9" r="2" fill="#3a4a2a"/>
    <circle cx="6" cy="-9" r="2" fill="#3a4a2a"/>
  </g>

  <!-- torn edge flourish, bottom border -->
  <path d="M 0,494 L 60,494 L 55,486 L 90,490 L 130,482 L 180,492 L 240,486 L 300,494 L 820,494 L 820,500 L 0,500 Z"
        fill="#dfe8d2" opacity="0.7"/>

  <!--
    VIBE: sage-affirmation   ORIENTATION: horizontal
    SLOTS:
    title            x=60  y=40  w=420 h=60
    feeling_block    x=60  y=140 w=380 h=120
    gratitude_list   x=60  y=300 w=380 h=160
    quote            x=480 y=300 w=300 h=100
  -->
</svg>
