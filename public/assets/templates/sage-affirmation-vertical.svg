<svg viewBox="0 0 560 860" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dotsSageV" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#d8e0cc" opacity="0.6"/>
    </pattern>
    <filter id="shadowSageV" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4a5a3a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="560" height="860" rx="18" fill="#eef2e6"/>
  <rect width="560" height="860" rx="18" fill="url(#dotsSageV)"/>
  <rect x="6" y="6" width="548" height="848" rx="14" fill="none" stroke="#b7c9a8" stroke-width="6"/>

  <!-- gingham tape, top-left -->
  <g transform="rotate(-3 90 25)">
    <rect x="40" y="10" width="100" height="26" fill="#f5f0e6"/>
    <g stroke="#b7c9a8" stroke-width="1">
      <line x1="40" y1="20" x2="140" y2="20"/><line x1="55" y1="10" x2="55" y2="36"/>
      <line x1="70" y1="10" x2="70" y2="36"/><line x1="85" y1="10" x2="85" y2="36"/>
      <line x1="100" y1="10" x2="100" y2="36"/><line x1="115" y1="10" x2="115" y2="36"/>
    </g>
  </g>

  <!-- small cloud, top-right -->
  <g transform="translate(500,45)" fill="#f5f0e6" stroke="#c3d1b3" stroke-width="1.5">
    <ellipse cx="-12" cy="4" rx="12" ry="9"/>
    <ellipse cx="5" cy="-2" rx="15" ry="11"/>
    <ellipse cx="20" cy="4" rx="10" ry="7"/>
  </g>

  <!-- card backings, stacked -->
  <rect x="40" y="90"  width="480" height="70"  rx="10" fill="#ffffff" opacity="0.85" filter="url(#shadowSageV)"/>
  <rect x="40" y="180" width="480" height="180" rx="10" fill="#ffffff" opacity="0.85" filter="url(#shadowSageV)"/>
  <rect x="40" y="380" width="480" height="220" rx="10" fill="#ffffff" opacity="0.88" filter="url(#shadowSageV)"/>
  <rect x="40" y="620" width="480" height="140" rx="10" fill="#f5f0e6" stroke="#b7c9a8" stroke-width="2"
        stroke-dasharray="4 3" filter="url(#shadowSageV)"/>

  <!-- leaf-sprig vine, right margin -->
  <g transform="translate(535,150)" stroke="#6b7d5a" stroke-width="2.5" fill="none">
    <path d="M0,0 C 4,120 -6,260 2,400 C 6,500 -4,600 0,700"/>
  </g>
  <g fill="#a8bb7d">
    <ellipse cx="537" cy="230" rx="7" ry="4" transform="rotate(-25 537 230)"/>
    <ellipse cx="533" cy="340" rx="7" ry="4" transform="rotate(20 533 340)"/>
    <ellipse cx="537" cy="450" rx="7" ry="4" transform="rotate(-15 537 450)"/>
    <ellipse cx="533" cy="560" rx="7" ry="4" transform="rotate(25 533 560)"/>
  </g>

  <!-- checkbox sticker, bottom-left -->
  <g transform="translate(60,800)">
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#ffffff" stroke="#b7c9a8" stroke-width="2"/>
    <path d="M-6,0 L-1,6 L8,-7" stroke="#6b7d5a" stroke-width="2.5" fill="none"/>
  </g>

  <!-- little frog, bottom-right -->
  <g transform="translate(500,800)">
    <ellipse cx="0" cy="0" rx="22" ry="15" fill="#a8bb7d" stroke="#6b7d5a" stroke-width="1.5"/>
    <circle cx="-10" cy="-12" r="6" fill="#a8bb7d" stroke="#6b7d5a" stroke-width="1.5"/>
    <circle cx="8" cy="-12" r="6" fill="#a8bb7d" stroke="#6b7d5a" stroke-width="1.5"/>
    <circle cx="-10" cy="-12" r="2.5" fill="#3a4a2a"/>
    <circle cx="8" cy="-12" r="2.5" fill="#3a4a2a"/>
  </g>

  <path d="M 0,854 L 60,854 L 55,846 L 90,850 L 130,842 L 180,852 L 240,846 L 300,854 L 560,854 L 560,860 L 0,860 Z"
        fill="#dfe8d2" opacity="0.7"/>

  <!--
    VIBE: sage-affirmation   ORIENTATION: vertical
    SLOTS:
    title            x=60  y=100 w=440 h=50
    feeling_block    x=60  y=190 w=440 h=160
    gratitude_list   x=60  y=390 w=440 h=200
    quote            x=60  y=630 w=440 h=120
  -->
</svg>