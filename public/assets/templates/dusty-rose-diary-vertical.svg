<svg viewBox="0 0 560 860" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dotsRoseV" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#f0d5da" opacity="0.6"/>
    </pattern>
    <filter id="shadowRoseV" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7a5c5c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="560" height="860" rx="18" fill="#fffaf7"/>
  <rect width="560" height="860" rx="18" fill="url(#dotsRoseV)"/>
  <rect x="6" y="6" width="548" height="848" rx="14" fill="none" stroke="#e8b4bc" stroke-width="6"/>

  <!-- ribbon bow, top-left -->
  <g transform="translate(65,30)">
    <path d="M0,0 L-22,-13 L-24,7 Z" fill="#e8b4bc" stroke="#c98a95"/>
    <path d="M0,0 L22,-13 L24,7 Z" fill="#e8b4bc" stroke="#c98a95"/>
    <circle cx="0" cy="0" r="5" fill="#7a5c5c"/>
  </g>

  <!-- pearls, top-right -->
  <g fill="#fdf4f0" stroke="#e8b4bc" stroke-width="1">
    <circle cx="480" cy="45" r="4.5"/><circle cx="494" cy="50" r="4.5"/><circle cx="508" cy="47" r="4.5"/>
  </g>

  <!-- card backings, stacked -->
  <rect x="40" y="90"  width="480" height="70"  rx="10" fill="#ffffff" opacity="0.88" filter="url(#shadowRoseV)"/>
  <rect x="40" y="180" width="480" height="180" rx="10" fill="#ffffff" opacity="0.88" filter="url(#shadowRoseV)"/>
  <rect x="40" y="380" width="480" height="220" rx="10" fill="#ffffff" opacity="0.9" filter="url(#shadowRoseV)"/>
  <rect x="40" y="620" width="480" height="140" rx="10" fill="#fdf0f0" stroke="#e8b4bc" stroke-width="2"
        stroke-dasharray="4 3" filter="url(#shadowRoseV)"/>

  <!-- baby's breath vine, right margin -->
  <g transform="translate(535,150)" stroke="#c98a95" stroke-width="1.6" fill="none">
    <path d="M0,0 C 4,120 -6,260 2,400 C 6,500 -4,600 0,700"/>
  </g>
  <g fill="#f3d9df">
    <circle cx="537" cy="220" r="3"/><circle cx="533" cy="320" r="3"/>
    <circle cx="537" cy="430" r="3"/><circle cx="533" cy="540" r="3"/><circle cx="537" cy="640" r="3"/>
  </g>

  <!-- heart charm, bottom-left -->
  <g transform="translate(60,800)">
    <path d="M0,8 C-12,-3 -12,-14 0,-7 C12,-14 12,-3 0,8 Z" fill="#e8b4bc" stroke="#c98a95" stroke-width="1.2"/>
  </g>

  <!-- lace scallop, bottom-right -->
  <g transform="translate(460,800)" fill="none" stroke="#e8b4bc" stroke-width="1.5">
    <path d="M0,10 Q8,0 16,10 T32,10 T48,10"/>
  </g>

  <path d="M 0,854 L 60,854 L 55,846 L 90,850 L 130,842 L 180,852 L 240,846 L 300,854 L 560,854 L 560,860 L 0,860 Z"
        fill="#f8e4e6" opacity="0.7"/>

  <!--
    VIBE: dusty-rose-diary   ORIENTATION: vertical
    SLOTS:
    title            x=60  y=100 w=440 h=50
    feeling_block    x=60  y=190 w=440 h=160
    gratitude_list   x=60  y=390 w=440 h=200
    quote            x=60  y=630 w=440 h=120
  -->
</svg>