<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dotsDark" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#5c4a38" opacity="0.35"/>
    </pattern>
    <filter id="shadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="820" height="500" rx="18" fill="#3e332a"/>
  <rect width="820" height="500" rx="18" fill="url(#dotsDark)"/>
  <rect x="6" y="6" width="808" height="488" rx="14" fill="none" stroke="#8a5a2a" stroke-width="6"/>

  <!-- folded page corner, top-left -->
  <path d="M12,12 L90,12 L12,90 Z" fill="#4a3b2a" stroke="#2f2418" stroke-width="1"/>

  <!-- wax seal, top-right -->
  <g transform="translate(760,45)">
    <circle cx="0" cy="0" r="22" fill="#5c1f2e" stroke="#3e0f18" stroke-width="2"/>
    <path d="M-8,-4 L0,6 L8,-4 M-8,4 L0,-6 L8,4" stroke="#8a3a45" stroke-width="1.5" fill="none"/>
  </g>

  <!-- card backings, parchment-toned -->
  <rect x="50" y="30" width="440" height="80" rx="6" fill="#efe4d0" opacity="0.92" filter="url(#shadowDark)"/>
  <rect x="50" y="130" width="400" height="140" rx="6" fill="#efe4d0" opacity="0.92" filter="url(#shadowDark)"/>
  <rect x="50" y="290" width="400" height="180" rx="6" fill="#efe4d0" opacity="0.94" filter="url(#shadowDark)"/>
  <rect x="470" y="290" width="320" height="120" rx="6" fill="#e6d8be" stroke="#8a5a2a" stroke-width="2"
        filter="url(#shadowDark)"/>

  <!-- candle, bottom-right -->
  <g transform="translate(760,440)">
    <rect x="-10" y="0" width="20" height="40" rx="3" fill="#e6d8be"/>
    <path d="M0,-4 C -4,-14 4,-14 0,-24" stroke="#c98a2e" stroke-width="0" fill="#e8763c"/>
    <ellipse cx="0" cy="-8" rx="4" ry="8" fill="#e8763c"/>
    <ellipse cx="0" cy="-6" rx="2" ry="4" fill="#f5d98a"/>
  </g>

  <!-- ink blot, left margin -->
  <g transform="translate(24,120)" fill="#2f2418">
    <path d="M0,0 C 10,-4 14,6 6,10 C 12,16 4,22 -2,16 C -10,20 -14,10 -6,6 C -12,0 -6,-6 0,0 Z"/>
  </g>

  <path d="M 0,494 L 60,494 L 55,486 L 90,490 L 130,482 L 180,492 L 240,486 L 300,494 L 820,494 L 820,500 L 0,500 Z"
        fill="#332a20" opacity="0.8"/>

  <!--
    VIBE: dark-academia   ORIENTATION: horizontal
    NOTE: parchment-toned slot backings mean text should render in the dark
    ink color (#2f2418), not the light color used on the other vibes.
    SLOTS:
    title            x=60  y=40  w=420 h=60
    feeling_block    x=60  y=140 w=380 h=120
    gratitude_list   x=60  y=300 w=380 h=160
    quote            x=480 y=300 w=300 h=100
  -->
</svg>