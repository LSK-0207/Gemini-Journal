<svg viewBox="0 0 560 860" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dotsDarkV" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#5c4a38" opacity="0.35"/>
    </pattern>
    <filter id="shadowDarkV" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="560" height="860" rx="18" fill="#3e332a"/>
  <rect width="560" height="860" rx="18" fill="url(#dotsDarkV)"/>
  <rect x="6" y="6" width="548" height="848" rx="14" fill="none" stroke="#8a5a2a" stroke-width="6"/>

  <!-- folded page corner, top-left -->
  <path d="M12,12 L80,12 L12,80 Z" fill="#4a3b2a" stroke="#2f2418" stroke-width="1"/>

  <!-- wax seal, top-right -->
  <g transform="translate(500,45)">
    <circle cx="0" cy="0" r="20" fill="#5c1f2e" stroke="#3e0f18" stroke-width="2"/>
    <path d="M-7,-3 L0,5 L7,-3 M-7,3 L0,-5 L7,3" stroke="#8a3a45" stroke-width="1.3" fill="none"/>
  </g>

  <!-- card backings, parchment -->
  <rect x="40" y="90"  width="480" height="70"  rx="6" fill="#efe4d0" opacity="0.94" filter="url(#shadowDarkV)"/>
  <rect x="40" y="180" width="480" height="180" rx="6" fill="#efe4d0" opacity="0.94" filter="url(#shadowDarkV)"/>
  <rect x="40" y="380" width="480" height="220" rx="6" fill="#efe4d0" opacity="0.95" filter="url(#shadowDarkV)"/>
  <rect x="40" y="620" width="480" height="140" rx="6" fill="#e6d8be" stroke="#8a5a2a" stroke-width="2"
        filter="url(#shadowDarkV)"/>

  <!-- ink drip vine, right margin -->
  <g transform="translate(535,150)" fill="#2f2418">
    <circle cx="0" cy="0" r="4"/><circle cx="-3" cy="90" r="3"/><circle cx="3" cy="220" r="4"/>
    <circle cx="-2" cy="340" r="3"/><circle cx="2" cy="480" r="4"/>
    <path d="M0,-4 C -6,20 6,40 0,60" stroke="#2f2418" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- ink blot, bottom-left -->
  <g transform="translate(65,800)" fill="#2f2418">
    <path d="M0,0 C 9,-4 12,5 5,9 C 10,14 3,19 -2,14 C -9,17 -12,9 -5,5 C -10,0 -5,-5 0,0 Z"/>
  </g>

  <!-- candle, bottom-right -->
  <g transform="translate(500,800)">
    <rect x="-9" y="0" width="18" height="34" rx="3" fill="#e6d8be"/>
    <ellipse cx="0" cy="-8" rx="3.5" ry="7" fill="#e8763c"/>
    <ellipse cx="0" cy="-6" rx="1.8" ry="3.5" fill="#f5d98a"/>
  </g>

  <path d="M 0,854 L 60,854 L 55,846 L 90,850 L 130,842 L 180,852 L 240,846 L 300,854 L 560,854 L 560,860 L 0,860 Z"
        fill="#332a20" opacity="0.8"/>

  <!--
    VIBE: dark-academia   ORIENTATION: vertical
    NOTE: use dark ink text (#2f2418) on the parchment cards here, not the
    light text color used by the other three vibes.
    SLOTS:
    title            x=60  y=100 w=440 h=50
    feeling_block    x=60  y=190 w=440 h=160
    gratitude_list   x=60  y=390 w=440 h=200
    quote            x=60  y=630 w=440 h=120
  -->
</svg>