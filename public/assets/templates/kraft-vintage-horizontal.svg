<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dotsKraft" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#b89968" opacity="0.4"/>
    </pattern>
    <filter id="shadowKraft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3a2c1a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="820" height="500" rx="18" fill="#c8a878"/>
  <rect width="820" height="500" rx="18" fill="url(#dotsKraft)"/>
  <rect x="6" y="6" width="808" height="488" rx="14" fill="none" stroke="#5a4632" stroke-width="6"/>

  <!-- postage stamp, top-left -->
  <g transform="translate(60,45)">
    <rect x="-30" y="-24" width="60" height="48" fill="#efe6d5" stroke="#5a4632" stroke-width="1.5"
          stroke-dasharray="3 2"/>
    <circle cx="0" cy="-6" r="10" fill="none" stroke="#5a4632" stroke-width="1.2"/>
    <text x="0" y="18" font-size="9" fill="#5a4632" text-anchor="middle" font-family="serif">AIR MAIL</text>
  </g>

  <!-- twine-tied luggage tag, top-right -->
  <g transform="translate(750,50)">
    <path d="M-30,0 L10,-20 L30,0 L10,20 Z" fill="#e6d3ab" stroke="#5a4632" stroke-width="1.5"/>
    <circle cx="10" cy="0" r="3" fill="none" stroke="#5a4632"/>
    <path d="M13,0 C 40,-10 40,10 60,0" stroke="#8a6a3a" stroke-width="1.5" fill="none"/>
  </g>

  <!-- card backings -->
  <rect x="50" y="30" width="440" height="80" rx="8" fill="#efe6d5" opacity="0.92" filter="url(#shadowKraft)"/>
  <rect x="50" y="130" width="400" height="140" rx="8" fill="#efe6d5" opacity="0.92" filter="url(#shadowKraft)"/>
  <rect x="50" y="290" width="400" height="180" rx="8" fill="#f5ecd9" opacity="0.94" filter="url(#shadowKraft)"/>
  <rect x="470" y="290" width="320" height="120" rx="8" fill="#e6d3ab" stroke="#5a4632" stroke-width="2"
        filter="url(#shadowKraft)"/>

  <!-- compass rose, bottom-right -->
  <g transform="translate(760,440)" stroke="#5a4632" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="26"/>
    <path d="M0,-26 L0,26 M-26,0 L26,0" stroke-width="1"/>
    <path d="M0,-20 L5,0 L0,20 L-5,0 Z" fill="#8a6a3a" stroke="none"/>
  </g>

  <!-- twine loop, left margin -->
  <g transform="translate(24,120)" stroke="#8a6a3a" stroke-width="2" fill="none">
    <path d="M0,-16 C 14,-10 14,10 0,16 C -14,10 -14,-10 0,-16 Z"/>
  </g>

  <path d="M 0,494 L 60,494 L 55,486 L 90,490 L 130,482 L 180,492 L 240,486 L 300,494 L 820,494 L 820,500 L 0,500 Z"
        fill="#a8895c" opacity="0.6"/>

  <!--
    VIBE: kraft-vintage   ORIENTATION: horizontal
    SLOTS:
    title            x=60  y=40  w=420 h=60
    feeling_block    x=60  y=140 w=380 h=120
    gratitude_list   x=60  y=300 w=380 h=160
    quote            x=480 y=300 w=300 h=100
  -->
</svg>