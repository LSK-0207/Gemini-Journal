<svg viewBox="0 0 560 860" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dotsKraftV" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#b89968" opacity="0.4"/>
    </pattern>
    <filter id="shadowKraftV" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3a2c1a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="560" height="860" rx="18" fill="#c8a878"/>
  <rect width="560" height="860" rx="18" fill="url(#dotsKraftV)"/>
  <rect x="6" y="6" width="548" height="848" rx="14" fill="none" stroke="#5a4632" stroke-width="6"/>

  <!-- postage stamp, top-left -->
  <g transform="translate(65,45)">
    <rect x="-26" y="-20" width="52" height="42" fill="#efe6d5" stroke="#5a4632" stroke-width="1.5"
          stroke-dasharray="3 2"/>
    <circle cx="0" cy="-4" r="8" fill="none" stroke="#5a4632" stroke-width="1.1"/>
    <text x="0" y="16" font-size="8" fill="#5a4632" text-anchor="middle" font-family="serif">AIR MAIL</text>
  </g>

  <!-- twine-tied luggage tag, top-right -->
  <g transform="translate(490,50)">
    <path d="M-22,0 L8,-15 L22,0 L8,15 Z" fill="#e6d3ab" stroke="#5a4632" stroke-width="1.3"/>
    <circle cx="8" cy="0" r="2.5" fill="none" stroke="#5a4632"/>
  </g>

  <!-- card backings, stacked -->
  <rect x="40" y="90"  width="480" height="70"  rx="8" fill="#efe6d5" opacity="0.92" filter="url(#shadowKraftV)"/>
  <rect x="40" y="180" width="480" height="180" rx="8" fill="#efe6d5" opacity="0.92" filter="url(#shadowKraftV)"/>
  <rect x="40" y="380" width="480" height="220" rx="8" fill="#f5ecd9" opacity="0.94" filter="url(#shadowKraftV)"/>
  <rect x="40" y="620" width="480" height="140" rx="8" fill="#e6d3ab" stroke="#5a4632" stroke-width="2"
        filter="url(#shadowKraftV)"/>

  <!-- twine, right margin, tying the whole page together -->
  <g transform="translate(535,150)" stroke="#8a6a3a" stroke-width="2" fill="none">
    <path d="M0,0 C 4,120 -6,260 2,400 C 6,500 -4,600 0,700"/>
  </g>
  <g fill="none" stroke="#8a6a3a" stroke-width="1.5">
    <circle cx="537" cy="230" r="6"/><circle cx="533" cy="450" r="6"/><circle cx="537" cy="600" r="6"/>
  </g>

  <!-- compass rose, bottom-right -->
  <g transform="translate(495,795)" stroke="#5a4632" stroke-width="1.4" fill="none">
    <circle cx="0" cy="0" r="22"/>
    <path d="M0,-22 L0,22 M-22,0 L22,0" stroke-width="1"/>
    <path d="M0,-17 L4,0 L0,17 L-4,0 Z" fill="#8a6a3a" stroke="none"/>
  </g>

  <!-- twine loop, bottom-left -->
  <g transform="translate(65,795)" stroke="#8a6a3a" stroke-width="2" fill="none">
    <path d="M0,-14 C 12,-9 12,9 0,14 C -12,9 -12,-9 0,-14 Z"/>
  </g>

  <path d="M 0,854 L 60,854 L 55,846 L 90,850 L 130,842 L 180,852 L 240,846 L 300,854 L 560,854 L 560,860 L 0,860 Z"
        fill="#a8895c" opacity="0.6"/>

  <!--
    VIBE: kraft-vintage   ORIENTATION: vertical
    SLOTS:
    title            x=60  y=100 w=440 h=50
    feeling_block    x=60  y=190 w=440 h=160
    gratitude_list   x=60  y=390 w=440 h=200
    quote            x=60  y=630 w=440 h=120
  -->
</svg>