<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="85%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="200" height="200" fill="url(#sky-grad)"/>
  <!-- Glowing sun -->
  <circle cx="160" cy="50" r="30" fill="#fef08a" opacity="0.8"/>
  <circle cx="160" cy="50" r="18" fill="#fff" opacity="0.9"/>
  <!-- Field hills -->
  <path d="M0,130 Q100,115 200,135 L200,200 L0,200 Z" fill="#65a30d"/>
  <path d="M0,150 Q100,135 200,155 L200,200 L0,200 Z" fill="#4d7c0f"/>
  <!-- Sunflowers in field -->
  <g transform="translate(40, 140)">
    <circle cx="0" cy="0" r="16" fill="#facc15"/>
    <circle cx="0" cy="0" r="8" fill="#713f12"/>
    <path d="M0,12 L0,45" stroke="#365314" stroke-width="3"/>
  </g>
  <g transform="translate(110, 130)">
    <circle cx="0" cy="0" r="22" fill="#eab308"/>
    <circle cx="0" cy="0" r="11" fill="#451a03"/>
    <path d="M0,15 L0,60" stroke="#365314" stroke-width="3.5"/>
  </g>
  <g transform="translate(170, 145)">
    <circle cx="0" cy="0" r="14" fill="#facc15"/>
    <circle cx="0" cy="0" r="7" fill="#78350f"/>
    <path d="M0,10 L0,45" stroke="#365314" stroke-width="2.5"/>
  </g>
  <!-- Foreground flowers -->
  <circle cx="20" cy="180" r="10" fill="#fef08a"/>
  <circle cx="20" cy="180" r="4" fill="#713f12"/>
  <circle cx="75" cy="175" r="12" fill="#facc15"/>
  <circle cx="75" cy="175" r="5" fill="#451a03"/>
  <circle cx="145" cy="182" r="11" fill="#facc15"/>
  <circle cx="145" cy="182" r="5" fill="#78350f"/>
</svg>
