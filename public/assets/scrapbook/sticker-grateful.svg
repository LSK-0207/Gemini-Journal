<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <filter id="sticker-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#4c0519" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#sticker-shadow)">
    <!-- Die-cut white border -->
    <path d="M70,12 C95,-4 135,16 135,52 C135,92 70,128 70,128 C70,128 5,92 5,52 C5,16 45,-4 70,12 Z" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <!-- Watercolor inner heart fill -->
    <path d="M70,20 C92,6 127,24 127,54 C127,88 70,120 70,120 C70,120 13,88 13,54 C13,24 48,6 70,20 Z" fill="#ffe4e6" opacity="0.9"/>
    <!-- Hand lettered text -->
    <text x="70" y="55" font-family="'Caveat', cursive" font-size="18" font-weight="bold" fill="#e11d48" text-anchor="middle">grateful</text>
    <text x="70" y="74" font-family="'Caveat', cursive" font-size="16" fill="#be123c" text-anchor="middle">heart ♡</text>
    <!-- Little stars -->
    <circle cx="45" cy="40" r="1.5" fill="#f43f5e"/>
    <circle cx="95" cy="42" r="1.5" fill="#f43f5e"/>
  </g>
</svg>
