<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100" width="100%" height="100%">
  <defs>
    <filter id="clip-shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#713f12" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <g filter="url(#clip-shadow)">
    <!-- Butterfly wire shaped gold clip -->
    <path d="M30,35 C15,10 5,25 15,45 C25,60 30,50 30,35 C30,50 35,60 45,45 C55,25 45,10 30,35 Z" fill="none" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M30,50 L30,90 C30,95 24,95 24,90 L24,40" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M30,50 L30,90 C30,95 36,95 36,90 L36,40" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
