<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100%" height="100%">
  <defs>
    <filter id="stamp3-shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#451a03" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#stamp3-shadow)">
    <rect x="4" y="4" width="92" height="122" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4,2"/>
    <rect x="10" y="10" width="80" height="110" fill="#fefce8" stroke="#d97706" stroke-width="1"/>
    
    <!-- Sunflower Stamp -->
    <g transform="translate(50, 60)">
      <!-- Petals -->
      <circle cx="0" cy="0" r="14" fill="#78350f"/>
      <circle cx="0" cy="0" r="10" fill="#451a03"/>
      <!-- Radiating petals -->
      <path d="M0,-14 L0,-24 M10,-10 L17,-17 M14,0 L24,0 M10,10 L17,17 M0,14 L0,24 M-10,10 L-17,17 M-14,0 L-24,0 M-10,-10 L-17,-17" stroke="#eab308" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M0,14 L0,36" stroke="#65a30d" stroke-width="2"/>
    </g>

    <circle cx="30" cy="90" r="18" fill="none" stroke="#92400e" stroke-width="0.75" stroke-dasharray="2,1" opacity="0.6"/>
    <text x="75" y="24" font-family="'Lora', serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">50¢</text>
    <text x="50" y="114" font-family="'Caveat', cursive" font-size="9" fill="#92400e" text-anchor="middle">Summer Solstice</text>
  </g>
</svg>
