<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 280" width="100%" height="100%">
  <defs>
    <filter id="sprig-shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#4a3b32" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sprig-shadow)">
    <!-- Main dried wooden stem -->
    <path d="M60,270 Q58,190 62,110 Q64,40 58,10" fill="none" stroke="#8c6d58" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Left branches -->
    <path d="M60,210 Q40,190 25,170" fill="none" stroke="#a08068" stroke-width="1.5"/>
    <path d="M61,160 Q35,135 20,115" fill="none" stroke="#a08068" stroke-width="1.5"/>
    <path d="M62,110 Q42,90 28,75" fill="none" stroke="#a08068" stroke-width="1.2"/>
    <path d="M63,60 Q48,45 35,35" fill="none" stroke="#a08068" stroke-width="1"/>

    <!-- Right branches -->
    <path d="M60,230 Q75,210 95,195" fill="none" stroke="#a08068" stroke-width="1.5"/>
    <path d="M61,180 Q85,155 100,135" fill="none" stroke="#a08068" stroke-width="1.5"/>
    <path d="M62,130 Q82,105 95,85" fill="none" stroke="#a08068" stroke-width="1.2"/>
    <path d="M63,80 Q80,60 90,45" fill="none" stroke="#a08068" stroke-width="1"/>

    <!-- Dried pink/cream baby's breath clusters -->
    <g fill="#fce7f3" stroke="#f472b6" stroke-width="0.5">
      <circle cx="25" cy="170" r="4.5"/>
      <circle cx="20" cy="165" r="3.5"/>
      <circle cx="20" cy="115" r="4.5"/>
      <circle cx="15" cy="110" r="3.5"/>
      <circle cx="28" cy="75" r="4"/>
      <circle cx="35" cy="35" r="3.5"/>
      <circle cx="58" cy="10" r="4"/>

      <circle cx="95" cy="195" r="4.5"/>
      <circle cx="102" cy="190" r="3.5"/>
      <circle cx="100" cy="135" r="4.5"/>
      <circle cx="95" cy="85" r="4"/>
      <circle cx="90" cy="45" r="3.5"/>
    </g>
    <!-- Dried flower centers -->
    <g fill="#be185d" opacity="0.6">
      <circle cx="25" cy="170" r="1.2"/>
      <circle cx="20" cy="115" r="1.2"/>
      <circle cx="28" cy="75" r="1"/>
      <circle cx="58" cy="10" r="1.2"/>
      <circle cx="95" cy="195" r="1.2"/>
      <circle cx="100" cy="135" r="1.2"/>
      <circle cx="95" cy="85" r="1"/>
    </g>
  </g>
</svg>
