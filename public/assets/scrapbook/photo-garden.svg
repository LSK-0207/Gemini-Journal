<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="garden-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#garden-sky)"/>
  <!-- Sun flare through trees -->
  <circle cx="80" cy="65" r="45" fill="#fef08a" opacity="0.4"/>
  <circle cx="80" cy="65" r="20" fill="#fff" opacity="0.7"/>
  <!-- Garden arch trees -->
  <path d="M-20,120 Q30,10 90,60 Q140,20 220,100 L220,200 L-20,200 Z" fill="#15803d" opacity="0.85"/>
  <path d="M-10,140 Q40,40 100,80 Q160,50 210,130 L210,200 L-10,200 Z" fill="#166534"/>
  <!-- Winding stone path -->
  <path d="M85,110 Q95,140 70,200 L130,200 Q105,150 95,110 Z" fill="#d6d3d1"/>
  <path d="M88,110 L75,200 M115,190 L95,120" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,6"/>
  <!-- Colorful flower bushes along path -->
  <circle cx="50" cy="160" r="15" fill="#f43f5e" opacity="0.9"/>
  <circle cx="60" cy="180" r="12" fill="#fb7185" opacity="0.9"/>
  <circle cx="135" cy="155" r="16" fill="#a855f7" opacity="0.9"/>
  <circle cx="150" cy="175" r="14" fill="#c084fc" opacity="0.9"/>
  <circle cx="40" cy="185" r="10" fill="#facc15" opacity="0.9"/>
  <circle cx="125" cy="185" r="10" fill="#facc15" opacity="0.9"/>
</svg>
