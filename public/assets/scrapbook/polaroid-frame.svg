<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="polaroid-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#2d241e" flood-opacity="0.28"/>
    </filter>
    <filter id="inner-photo-shadow">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1.5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  <g filter="url(#polaroid-shadow)">
    <!-- White / Cream Photo Cardboard -->
    <rect x="10" y="8" width="180" height="220" rx="3" fill="#fcfbf9" stroke="#e8e2d8" stroke-width="1.2"/>
    <!-- Photo window aperture -->
    <rect id="photo-frame-aperture" x="22" y="20" width="156" height="150" fill="#1c1917" filter="url(#inner-photo-shadow)"/>
    <!-- Caption placeholder line -->
    <line x1="35" y1="198" x2="165" y2="198" stroke="#d5cdbf" stroke-width="1" stroke-dasharray="2,3"/>
  </g>
</svg>
