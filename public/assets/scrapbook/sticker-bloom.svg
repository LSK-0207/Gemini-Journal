<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 70" width="100%" height="100%">
  <defs>
    <filter id="bloom-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="1" dy="2.5" stdDeviation="1.5" flood-color="#14532d" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#bloom-shadow)">
    <!-- White die-cut outline -->
    <rect x="5" y="5" width="140" height="60" rx="14" fill="#ffffff" stroke="#dcfce7" stroke-width="2"/>
    <!-- Sage green badge body -->
    <rect x="9" y="9" width="132" height="52" rx="11" fill="#4d7c0f"/>
    <!-- Lettering -->
    <text x="75" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#f7fee7" text-anchor="middle">BLOOM</text>
    <text x="75" y="49" font-family="'Caveat', cursive" font-size="14" font-weight="bold" fill="#ecfccb" text-anchor="middle">where you are planted 🌿</text>
  </g>
</svg>
