<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="seal-shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#451a03" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="wax-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
  </defs>
  <g filter="url(#seal-shadow)">
    <!-- Irregular melted wax blob border -->
    <path d="M50,10 Q68,6 80,18 Q94,30 90,48 Q94,68 82,82 Q68,95 48,90 Q28,94 16,80 Q4,66 10,48 Q6,28 20,16 Q34,6 50,10 Z" fill="url(#wax-grad)"/>
    <!-- Pressed inner seal ring -->
    <circle cx="50" cy="50" r="28" fill="#ca8a04" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="25" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Daisy imprint in wax -->
    <g transform="translate(50, 50)" fill="#fef08a" opacity="0.9">
      <circle cx="0" cy="0" r="6" fill="#78350f"/>
      <ellipse cx="0" cy="-14" rx="3.5" ry="7"/>
      <ellipse cx="10" cy="-10" rx="3.5" ry="7" transform="rotate(45 10 -10)"/>
      <ellipse cx="14" cy="0" rx="7" ry="3.5"/>
      <ellipse cx="10" cy="10" rx="3.5" ry="7" transform="rotate(-45 10 10)"/>
      <ellipse cx="0" cy="14" rx="3.5" ry="7"/>
      <ellipse cx="-10" cy="10" rx="3.5" ry="7" transform="rotate(45 -10 10)"/>
      <ellipse cx="-14" cy="0" rx="7" ry="3.5"/>
      <ellipse cx="-10" cy="-10" rx="3.5" ry="7" transform="rotate(-45 -10 -10)"/>
    </g>
  </g>
</svg>
