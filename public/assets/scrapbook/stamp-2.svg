<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100%" height="100%">
  <defs>
    <filter id="stamp2-shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#2d3b2d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#stamp2-shadow)">
    <!-- Perforated Stamp Base -->
    <rect x="4" y="4" width="92" height="122" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="4,2"/>
    <rect x="10" y="10" width="80" height="110" fill="#fcfdfc" stroke="#86efac" stroke-width="1"/>
    
    <!-- Watering can with flower bouquet -->
    <g transform="translate(50, 68)">
      <!-- Can body -->
      <path d="M-16,10 L16,10 L12,28 L-12,28 Z" fill="#84cc16" stroke="#4d7c0f" stroke-width="1"/>
      <!-- Spout -->
      <path d="M12,18 L24,6" stroke="#4d7c0f" stroke-width="2"/>
      <ellipse cx="25" cy="5" rx="3" ry="5" fill="#65a30d"/>
      <!-- Handle -->
      <path d="M-12,12 Q-22,18 -10,26" fill="none" stroke="#4d7c0f" stroke-width="1.5"/>
      <!-- Daisies sprouting from can -->
      <circle cx="-4" cy="2" r="5" fill="#fef08a"/>
      <circle cx="6" cy="-2" r="5" fill="#fef08a"/>
      <circle cx="0" cy="-8" r="6" fill="#facc15"/>
    </g>

    <!-- Postmark -->
    <circle cx="70" cy="95" r="20" fill="none" stroke="#15803d" stroke-width="0.75" stroke-dasharray="2,1" opacity="0.6"/>
    <text x="25" y="24" font-family="'Lora', serif" font-size="11" font-weight="bold" fill="#15803d">15</text>
    <text x="50" y="114" font-family="'Caveat', cursive" font-size="9" fill="#166534" text-anchor="middle">Botanica 1924</text>
  </g>
</svg>
