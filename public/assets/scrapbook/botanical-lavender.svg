    </g>
    <g fill="#a855f7" opacity="0.6">
      <circle cx="51" cy="108" r="2.5"/>
      <circle cx="51" cy="92" r="2.5"/>
      <circle cx="51" cy="76" r="2.5"/>
      <circle cx="51" cy="61" r="2"/>
    </g>
