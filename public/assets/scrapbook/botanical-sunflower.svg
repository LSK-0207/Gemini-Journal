<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="100%" height="100%">
  <defs>
    <radialGradient id="sun-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="65%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <filter id="flower-shadow">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#3c2f1f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#flower-shadow)">
    <!-- Stem and leaves -->
    <path d="M80,80 Q78,160 85,250" fill="none" stroke="#4d7c0f" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M80,140 Q55,130 50,150 Q70,155 81,146" fill="#65a30d" stroke="#365314" stroke-width="1"/>
    <path d="M82,180 Q110,165 115,185 Q95,195 83,184" fill="#65a30d" stroke="#365314" stroke-width="1"/>
    <!-- Outer Petals (golden yellow) -->
    <g transform="translate(80, 80)">
      <!-- 16 radiant petals -->
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(22.5)" fill="#eab308" stroke="#a16207" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(45)" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(67.5)" fill="#eab308" stroke="#a16207" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(90)" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(112.5)" fill="#eab308" stroke="#a16207" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(135)" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(157.5)" fill="#eab308" stroke="#a16207" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(180)" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(202.5)" fill="#eab308" stroke="#a16207" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(225)" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(247.5)" fill="#eab308" stroke="#a16207" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(270)" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(292.5)" fill="#eab308" stroke="#a16207" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(315)" fill="#facc15" stroke="#ca8a04" stroke-width="0.8"/>
      <path d="M0,0 Q-10,-55 0,-70 Q10,-55 0,0" transform="rotate(337.5)" fill="#eab308" stroke="#a16207" stroke-width="0.8"/>
      <!-- Inner florets layer -->
      <circle cx="0" cy="0" r="28" fill="url(#sun-center)"/>
      <circle cx="0" cy="0" r="27" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="2,3"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="2,2"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="1.5,1.5"/>
    </g>
  </g>
</svg>
