<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%">
  <defs>
    <filter id="bow-green-shadow">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#14532d" flood-opacity="0.25"/>
    </filter>
    <pattern id="plaid-bow-pat" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#dcfce7"/>
      <rect x="0" y="0" width="4" height="8" fill="#86efac" opacity="0.6"/>
      <rect x="0" y="0" width="8" height="4" fill="#86efac" opacity="0.6"/>
    </pattern>
  </defs>
  <g filter="url(#bow-green-shadow)">
    <!-- Left loop -->
    <path d="M60,40 C35,15 10,25 15,48 C20,65 50,48 60,45" fill="url(#plaid-bow-pat)" stroke="#4ade80" stroke-width="1.2"/>
    <!-- Right loop -->
    <path d="M60,40 C85,15 110,25 105,48 C100,65 70,48 60,45" fill="url(#plaid-bow-pat)" stroke="#4ade80" stroke-width="1.2"/>
    <!-- Left ribbon tail -->
    <path d="M56,46 Q40,65 25,85 L35,85 Q50,68 58,50 Z" fill="url(#plaid-bow-pat)" stroke="#4ade80" stroke-width="1"/>
    <!-- Right ribbon tail -->
    <path d="M64,46 Q80,65 95,85 L85,85 Q70,68 62,50 Z" fill="url(#plaid-bow-pat)" stroke="#4ade80" stroke-width="1"/>
    <!-- Center knot -->
    <ellipse cx="60" cy="44" rx="8" ry="7" fill="#22c55e" stroke="#15803d" stroke-width="1.2"/>
  </g>
</svg>
