<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%">
  <defs>
    <filter id="bow-shadow">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#4c0519" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#bow-shadow)">
    <!-- Left loop -->
    <path d="M60,40 C35,15 10,25 15,48 C20,65 50,48 60,45" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.2"/>
    <path d="M55,38 C35,22 18,30 22,46 C25,58 48,46 55,42" fill="#f9a8d4" opacity="0.6"/>
    <!-- Right loop -->
    <path d="M60,40 C85,15 110,25 105,48 C100,65 70,48 60,45" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.2"/>
    <path d="M65,38 C85,22 102,30 98,46 C95,58 72,46 65,42" fill="#f9a8d4" opacity="0.6"/>
    <!-- Left ribbon tail -->
    <path d="M56,46 Q40,65 25,85 L35,85 Q50,68 58,50 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="1"/>
    <!-- Right ribbon tail -->
    <path d="M64,46 Q80,65 95,85 L85,85 Q70,68 62,50 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="1"/>
    <!-- Center knot -->
    <ellipse cx="60" cy="44" rx="8" ry="7" fill="#f472b6" stroke="#db2777" stroke-width="1.2"/>
    <!-- Pearl drop -->
    <circle cx="60" cy="58" r="4.5" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
    <circle cx="58.5" cy="56.5" r="1.5" fill="#fff"/>
  </g>
</svg>
