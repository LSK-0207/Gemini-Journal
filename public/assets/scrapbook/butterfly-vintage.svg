<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%">
  <defs>
    <filter id="bfly-shadow">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#262626" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#bfly-shadow)">
    <!-- Left Forewing -->
    <path d="M60,45 C45,15 15,20 10,40 C5,60 35,65 60,50 Z" fill="#faf5ee" stroke="#78350f" stroke-width="1.2"/>
    <path d="M60,45 C48,25 25,28 20,42" fill="none" stroke="#b45309" stroke-width="0.75"/>
    <circle cx="24" cy="38" r="3.5" fill="#fde047" stroke="#78350f" stroke-width="0.6"/>

    <!-- Right Forewing -->
    <path d="M60,45 C75,15 105,20 110,40 C115,60 85,65 60,50 Z" fill="#faf5ee" stroke="#78350f" stroke-width="1.2"/>
    <path d="M60,45 C72,25 95,28 100,42" fill="none" stroke="#b45309" stroke-width="0.75"/>
    <circle cx="96" cy="38" r="3.5" fill="#fde047" stroke="#78350f" stroke-width="0.6"/>

    <!-- Left Hindwing -->
    <path d="M60,50 C40,55 25,75 35,90 C45,100 55,75 60,55 Z" fill="#f5ebe0" stroke="#78350f" stroke-width="1"/>
    <!-- Right Hindwing -->
    <path d="M60,50 C80,55 95,75 85,90 C75,100 65,75 60,55 Z" fill="#f5ebe0" stroke="#78350f" stroke-width="1"/>

    <!-- Butterfly Body & Antennae -->
    <ellipse cx="60" cy="50" rx="3.5" ry="16" fill="#451a03"/>
    <path d="M59,36 Q50,22 44,18 M61,36 Q70,22 76,18" fill="none" stroke="#451a03" stroke-width="1.2"/>
    <circle cx="43" cy="17" r="1.5" fill="#451a03"/>
    <circle cx="77" cy="17" r="1.5" fill="#451a03"/>
  </g>
</svg>
