      <path d="M0,0 Q-6,-40 0,-50 Q6,-40 0,0" transform="rotate(128.5)" fill="#ffffff" stroke="#e5e0d8" stroke-width="0.8"/>
      <path d="M0,0 Q-6,-40 0,-50 Q6,-40 0,0" transform="rotate(154.2)" fill="#fdfbf7" stroke="#e5e0d8" stroke-width="0.8"/>
      <path d="M0,0 Q-6,-40 0,-50 Q6,-40 0,0" transform="rotate(180)" fill="#ffffff" stroke="#e5e0d8" stroke-width="0.8"/>
      <path d="M0,0 Q-6,-40 0,-50 Q6,-40 0,0" transform="rotate(205.7)" fill="#fdfbf7" stroke="#e5e0d8" stroke-width="0.8"/>
      <path d="M0,0 Q-6,-40 0,-50 Q6,-40 0,0" transform="rotate(231.4)" fill="#ffffff" stroke="#e5e0d8" stroke-width="0.8"/>
      <path d="M0,0 Q-6,-40 0,-50 Q6,-40 0,0" transform="rotate(257.1)" fill="#fdfbf7" stroke="#e5e0d8" stroke-width="0.8"/>
      <path d="M0,0 Q-6,-40 0,-50 Q6,-40 0,0" transform="rotate(282.8)" fill="#ffffff" stroke="#e5e0d8" stroke-width="0.8"/>
      <path d="M0,0 Q-6,-40 0,-50 Q6,-40 0,0" transform="rotate(308.5)" fill="#fdfbf7" stroke="#e5e0d8" stroke-width="0.8"/>
      <path d="M0,0 Q-6,-40 0,-50 Q6,-40 0,0" transform="rotate(334.2)" fill="#ffffff" stroke="#e5e0d8" stroke-width="0.8"/>
